# One-click data management service.
#
#   docker compose up -d                     # app only, talks to .env endpoints
#   docker compose --profile bundled up -d   # also bring up Postgres/MinIO/Redpanda

name: lumid-data

networks:
  lumid_net:
    name: lumid_net
    driver: bridge

volumes:
  postgres_data:
  minio_data:

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    profiles: [bundled]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    networks: [lumid_net]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.3.1
    restart: unless-stopped
    profiles: [bundled]
    command:
      - redpanda
      - start
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
    networks: [lumid_net]
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    profiles: [bundled]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-lumid_data}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-lumid_data_secret_change_me}
    volumes:
      - minio_data:/data
    networks: [lumid_net]
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-03T17-07-56Z
    profiles: [bundled]
    depends_on:
      minio:
        condition: service_healthy
    networks: [lumid_net]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-lumid_data} ${S3_SECRET_KEY:-lumid_data_secret_change_me} 2>/dev/null; do sleep 2; done;
      mc mb -p local/${S3_DEFAULT_BUCKET:-lumid-data} || true;
      mc anonymous set none local/${S3_DEFAULT_BUCKET:-lumid-data};
      echo 'minio buckets ready';
      exit 0
      "

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lumid-data:dev
    restart: unless-stopped
    env_file:
      - .env
    network_mode: host
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@127.0.0.1:5432/lumid_data}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://127.0.0.1:9000}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-127.0.0.1:9092}
    volumes:
      - ${AWS_CA_BUNDLE:-/dev/null}:${AWS_CA_BUNDLE:-/dev/null}:ro
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      minio:
        condition: service_healthy
        required: false
      minio-init:
        condition: service_completed_successfully
        required: false
      redpanda:
        condition: service_healthy
        required: false
