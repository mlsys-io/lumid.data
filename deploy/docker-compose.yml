# One-click data management service.
#
#   cd deploy && docker compose up -d
#
# Brings up Postgres, MinIO, the PostgREST sidecar that backs /db, and
# the lumid.data app itself. NATS is opt-in (set NATS_URL in .env to
# enable audit fan-out) but not required.

name: lumid-data

networks:
  lumid_net:
    name: lumid_net
    driver: bridge

volumes:
  postgres_data:
  minio_data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    networks: [lumid_net]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-lumid_data}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-lumid_data_secret_change_me}
    volumes:
      - minio_data:/data
    networks: [lumid_net]
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-03T17-07-56Z
    depends_on:
      minio:
        condition: service_healthy
    networks: [lumid_net]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-lumid_data} ${S3_SECRET_KEY:-lumid_data_secret_change_me} 2>/dev/null; do sleep 2; done;
      mc mb -p local/${S3_DEFAULT_BUCKET:-lumid-data} || true;
      mc anonymous set none local/${S3_DEFAULT_BUCKET:-lumid-data};
      echo 'minio buckets ready';
      exit 0
      "

  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://app_admin:${POSTGREST_USER_PASSWORD:-app_admin}@postgres:5432/lumid_data
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: postgrest_anon
      PGRST_JWT_SECRET: ${POSTGREST_JWT_SECRET:?POSTGREST_JWT_SECRET is required}
      PGRST_JWT_AUD: lumid-data
      PGRST_OPENAPI_MODE: ignore-privileges
      PGRST_LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    networks: [lumid_net]
    ports: ["3000:3000"]

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: lumid-data:dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://app_admin:${POSTGREST_USER_PASSWORD:-app_admin}@postgres:5432/lumid_data
      S3_ENDPOINT: http://minio:9000
      POSTGREST_URL: http://postgrest:3000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      postgrest:
        condition: service_started
    networks: [lumid_net]
    ports: ["9100:9100"]
